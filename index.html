<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>BotPanel | AnonSpam</title>
    <style>
        body { background: #202225; color: white; font-family: 'Whitney', 'Helvetica Neue', Helvetica, Arial, sans-serif; display: flex; height: 100vh; margin: 0; overflow: hidden; }
        #chat { flex: 1; display: flex; flex-direction: column; background: #36393f; }
        #msg-area { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
        .message { padding: 12px; border-radius: 4px; background: #32353b; align-self: flex-start; max-width: 85%; border-left: 4px solid #5865f2; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        .message img { max-width: 100%; border-radius: 4px; margin-top: 10px; display: block; cursor: zoom-in; }
        .user-name { font-weight: bold; color: #fff; font-size: 0.9em; margin-bottom: 5px; display: flex; align-items: center; gap: 8px; }
        .user-name::after { content: "BOT"; background: #5865f2; font-size: 10px; padding: 2px 4px; border-radius: 3px; }
        .input-box { padding: 20px; background: #2f3136; display: flex; gap: 12px; align-items: center; border-top: 1px solid #202225; }
        input { flex: 1; padding: 14px; border-radius: 6px; border: none; background: #40444b; color: #dcddde; outline: none; font-size: 15px; }
        button { padding: 12px 24px; background: #5865f2; border: none; color: white; border-radius: 4px; cursor: pointer; font-weight: bold; transition: 0.2s; text-transform: uppercase; }
        button:hover { background: #4752c4; }
        .overlay { position: fixed; inset: 0; background: #2f3136; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; text-align: center; }
        .card { background: #36393f; padding: 50px; border-radius: 8px; box-shadow: 0 15px 40px rgba(0,0,0,0.6); border: 1px solid #4f545c; }
        .lang-btn { margin: 10px; width: 150px; background: #4f545c; }
        .status-bar { padding: 12px 20px; background: #202225; display: flex; justify-content: space-between; align-items: center; font-size: 14px; border-bottom: 2px solid #2f3136; }
    </style>
</head>
<body>

<!-- Pantalla 1: Idioma -->
<div id="lang-screen" class="overlay">
    <div class="card">
        <h1>¿Qué idioma quieres? / Which language?</h1>
        <button class="lang-btn" onclick="setLang('es')">Español</button>
        <button class="lang-btn" onclick="setLang('en')">English</button>
    </div>
</div>

<!-- Pantalla 2: Token -->
<div id="login-screen" class="overlay" style="display:none;">
    <div class="card">
        <h1 id="login-title">BotPanel</h1>
        <p style="color: #72767d; margin-bottom: 30px;">Identificado como: <strong>NotDev</strong></p>
        <input type="password" id="bot_token" placeholder="Token..." style="width: 320px; margin-bottom: 20px; display: block;">
        <button id="login-btn" onclick="conectar()">Acceder</button>
    </div>
</div>

<div id="chat">
    <div class="status-bar">
        <span id="bot-status" style="color: #43b581; font-weight: bold;">● AnonSpam</span>
        <div>
            <span id="channel-display" style="color: #b9bbbe; margin-right: 15px;">ID: ---</span>
            <button id="btn-change" onclick="cambiarCanal()" style="padding: 6px 12px; font-size: 11px; background: #4f545c;">Cambiar</button>
        </div>
    </div>
    <div id="msg-area"></div>
    <div class="input-box">
        <input type="text" id="type-box" placeholder="..." onkeypress="if(event.key==='Enter') send()">
        <button id="btn-send" onclick="send()">Enviar</button>
    </div>
</div>

<script>
    let TOKEN = localStorage.getItem('bot_token_alt');
    let CHANNEL_ID = localStorage.getItem('last_channel_alt');
    let LANG = localStorage.getItem('bot_lang');

    const texts = {
        es: { login: "Acceder", token_ph: "Token del Bot (AnonSpam)", change: "Cambiar Destino", send: "Enviar", prompt: "ID del Canal o MD:", offline: "Desconectado", input_ph: "Escribe un mensaje..." },
        en: { login: "Login", token_ph: "Bot Token (AnonSpam)", change: "Change Target", send: "Send", prompt: "Channel or User ID (DM):", offline: "Offline", input_ph: "Type a message..." }
    };

    function setLang(l) {
        LANG = l;
        localStorage.setItem('bot_lang', l);
        document.getElementById('lang-screen').style.display = 'none';
        applyTexts();
        if (!TOKEN) { document.getElementById('login-screen').style.display = 'flex'; } 
        else { conectar(); }
    }

    function applyTexts() {
        const t = texts[LANG];
        document.getElementById('login-btn').innerText = t.login;
        document.getElementById('bot_token').placeholder = t.token_ph;
        document.getElementById('btn-change').innerText = t.change;
        document.getElementById('btn-send').innerText = t.send;
        document.getElementById('type-box').placeholder = t.input_ph;
    }

    if (LANG) { 
        document.getElementById('lang-screen').style.display = 'none'; 
        applyTexts();
        if (TOKEN) { conectar(); } else { document.getElementById('login-screen').style.display = 'flex'; }
    }

    async function conectar() {
        if (!TOKEN) TOKEN = document.getElementById('bot_token').value;
        try {
            const res = await fetch('https://discord.com', { headers: { 'Authorization': `Bot ${TOKEN}` } });
            if (res.ok) {
                const data = await res.json();
                localStorage.setItem('bot_token_alt', TOKEN);
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('bot-status').innerText = "● " + data.username;
                if (!CHANNEL_ID) cambiarCanal();
                else document.getElementById('channel-display').innerText = "ID: " + CHANNEL_ID;
                setInterval(fetchMessages, 3000);
                fetchMessages();
            } else {
                alert("Token Error");
                localStorage.removeItem('bot_token_alt');
                location.reload();
            }
        } catch (e) { alert("VPN / Network Error"); }
    }

    function cambiarCanal() {
        const id = prompt(texts[LANG].prompt, CHANNEL_ID || "");
        if (id) {
            CHANNEL_ID = id;
            localStorage.setItem('last_channel_alt', id);
            document.getElementById('channel-display').innerText = "ID: " + id;
            document.getElementById('msg-area').innerHTML = "";
            fetchMessages();
        }
    }

    async function fetchMessages() {
        if (!CHANNEL_ID || !TOKEN) return;
        try {
            const res = await fetch(`https://discord.com{CHANNEL_ID}/messages?limit=15`, { headers: { 'Authorization': `Bot ${TOKEN}` } });
            if (res.ok) {
                const msgs = await res.json();
                const area = document.getElementById('msg-area');
                const isBottom = area.scrollTop + area.clientHeight >= area.scrollHeight - 50;
                area.innerHTML = "";
                msgs.reverse().forEach(m => {
                    const div = document.createElement('div');
                    div.className = "message";
                    let content = `<div class="user-name">${m.author.username}</div><div>${m.content}</div>`;
                    m.attachments.forEach(att => { if (att.content_type?.startsWith('image/')) content += `<img src="${att.url}" onclick="window.open(this.src)">`; });
                    div.innerHTML = content;
                    area.appendChild(div);
                });
                if (isBottom) area.scrollTop = area.scrollHeight;
            }
        } catch(e) {}
    }

    async function send() {
        const val = document.getElementById('type-box').value;
        if (!val || !CHANNEL_ID) return;
        await fetch(`https://discord.com{CHANNEL_ID}/messages`, {
            method: 'POST',
            headers: { 'Authorization': `Bot ${TOKEN}`, 'Content-Type': 'application/json' },
            body: JSON.stringify({ content: val })
        });
        document.getElementById('type-box').value = "";
        fetchMessages();
    }
</script>
</body>
</html>
